<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tarot FH</title>
  <meta name="description" content="Tiradas de los 22 Arcanos Mayores. El azar se lee en los decimales de π.">
  <meta name="color-scheme" content="dark light">
  <!-- Seguridad: todo sale de este sitio, salvo el contador de barajadas (Abacus) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://abacus.jasoncameron.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="preload" href="fuentes/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="tema.js"></script>
</head>
<body>
  <!-- Retícula de cruces y textura de papel -->
  <svg class="reticula" aria-hidden="true">
    <defs>
      <pattern id="cruces" width="128" height="128" patternUnits="userSpaceOnUse">
        <path d="M64 60v8M60 64h8" stroke="currentColor" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#cruces)"/>
  </svg>

  <header class="cabecera">
    <div class="marca">
      <span class="idx">[00]</span>
      <span class="caja caja-corte" aria-hidden="true"></span>
      <span class="marca-texto">
        <a class="marca-nombre" href="https://www.instagram.com/fabianh3d/" target="_blank" rel="noopener" title="@fabianh3d en Instagram">TAROT FH</a>
        <span class="rotulo"><span class="contador" id="contador" title="Barajadas de todas las personas">······</span> BARAJADAS · AZAR π</span>
      </span>
    </div>

    <nav class="opciones" aria-label="Opciones de la tirada">
      <button class="opcion" type="button" data-opcion="invertidas" aria-pressed="false">
        <span class="idx">[01]</span><span class="caja" aria-hidden="true"></span>
        <span class="rotulo">INVERTIDAS</span>
      </button>
      <button class="opcion" type="button" data-opcion="frase" aria-pressed="true">
        <span class="idx">[02]</span><span class="caja" aria-hidden="true"></span>
        <span class="rotulo">FRASE</span>
      </button>
      <button class="opcion" type="button" data-opcion="rastro" aria-pressed="true">
        <span class="idx">[03]</span><span class="caja" aria-hidden="true"></span>
        <span class="rotulo">RASTRO π</span>
      </button>
      <button class="opcion" type="button" data-opcion="sonido" aria-pressed="false">
        <span class="idx">[04]</span><span class="caja" aria-hidden="true"></span>
        <span class="rotulo">SONIDO</span>
      </button>
      <button class="opcion opcion-tema" type="button" id="tema" aria-label="Cambiar entre tinta y papel" title="Tinta / papel">
        <span class="idx">[05]</span><span class="caja caja-tema" aria-hidden="true"></span>
        <span class="rotulo">TINTA</span>
      </button>
    </nav>

    <button class="reinicio abrir-rueda" type="button" id="abrir-rueda" aria-label="Rueda: traer una carta por su número" title="Rueda: traer una carta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
    </button>

    <button class="reinicio boton-foto" type="button" id="foto" aria-label="Sacar una foto de la tirada" title="Foto de la tirada">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5h3.2l1.6-2.5h7.4l1.6 2.5h3.2v10h-17z"/><circle cx="12" cy="13.3" r="3.4"/></svg>
    </button>

    <button class="reinicio" type="button" id="reinicio" aria-label="Volver al inicio" title="Volver al inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M17.5 3.5v4h-4"/></svg>
    </button>
  </header>

  <main class="mesa" id="mesa" aria-label="Mesa de tirada">
    <!-- Cotas del mazo y de la casilla de entrega (solo escritorio) -->
    <svg class="cotas" id="cotas" aria-hidden="true"></svg>

    <div class="mazo" id="mazo" role="button" tabindex="0" aria-label="Mazo: tocar para barajar y sacar una carta">
      <div class="mazo-pila" id="mazo-pila"></div>
    </div>
    <div class="mazo-cuenta" id="mazo-cuenta" aria-live="polite">XXII</div>
    <div class="descarte" id="descarte" aria-hidden="true"></div>

    <ol class="rastro" id="rastro" aria-label="Rastro de π"></ol>
  </main>

  <aside class="haiku" id="haiku" aria-live="polite">
    <div class="haiku-capa" data-capa="a"></div>
    <div class="haiku-capa" data-capa="b"></div>
  </aside>

  <div class="rueda" id="rueda" role="dialog" aria-modal="true" aria-label="Rueda: elegir una carta por su número" hidden>
    <div class="rueda-disco" id="rueda-disco" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="21" aria-valuenow="0" aria-label="Número de la carta">
      <svg viewBox="-200 -200 400 400" aria-hidden="true">
        <g id="rueda-fija"></g>
        <g id="rueda-giro"></g>
      </svg>
      <button class="rueda-centro" type="button" id="rueda-centro">
        <span class="rueda-num" id="rueda-num">0</span>
        <span class="rueda-accion" id="rueda-accion">TRAER</span>
      </button>
    </div>
    <p class="rueda-pie">GIRAR · ← → · ENTER TRAE · ESC CIERRA</p>
  </div>

  <div class="lupa" id="lupa" role="dialog" aria-modal="true" aria-labelledby="lupa-titulo" hidden>
    <figure class="lupa-figura">
      <img class="lupa-img" id="lupa-img" alt="" draggable="false">
      <figcaption class="lupa-pie">
        <span id="lupa-titulo"></span>
        <span class="lupa-medida" id="lupa-medida"></span>
      </figcaption>
    </figure>
  </div>

  <div class="aviso" id="aviso" role="alertdialog" aria-labelledby="aviso-texto" hidden>
    <p id="aviso-texto">¿RECOGER LA TIRADA?</p>
    <div class="aviso-botones">
      <button type="button" data-respuesta="si">SÍ</button>
      <button type="button" data-respuesta="no">NO</button>
    </div>
  </div>

  <!-- Reverso compartido: se dibuja una vez con los dígitos de π -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><symbol id="reverso" viewBox="0 0 70 120"></symbol></defs>
  </svg>

  <script src="pi.js"></script>
  <script src="azar.js"></script>
  <script src="app.js"></script>
</body>
</html>
